<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle / Round Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Moorish Arch Geometric Background Watermark -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="2" opacity="0.15"/>
  <polygon points="256,100 370,214 370,370 256,370 142,370 142,214" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.1"/>

  <!-- Moroccan Pentagram Star (Emerald on Red/Gold shield) -->
  <circle cx="256" cy="256" r="130" fill="#c2410c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="122" fill="#991b1b"/>

  <!-- 5-Pointed Interlaced Moroccan Green Star -->
  <polygon points="256,155 279,228 355,228 294,272 317,345 256,301 195,345 218,272 157,228 233,228" 
    fill="none" 
    stroke="#10b981" 
    stroke-width="14" 
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Central MAD Monogram & Symbol -->
  <circle cx="256" cy="256" r="42" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="256" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">DH</text>

  <!-- Arabic Typography "درهم" subtle curved or text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">MAD · درهم</text>
</svg>
